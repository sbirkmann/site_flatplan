<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Kalender mit gebuchten Besichtigungsterminen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="80" cy="80" r="3"/><circle cx="1120" cy="70" r="3"/><circle cx="1140" cy="560" r="3"/>
    <circle cx="60" cy="550" r="3"/><circle cx="1060" cy="140" r="2"/>
  </g>

  <!-- calendar -->
  <g>
    <rect x="170" y="110" width="560" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M170 134 a24 24 0 0 1 24 -24 h512 a24 24 0 0 1 24 24 v56 h-560 Z" fill="url(#head)"/>
    <!-- binder rings -->
    <rect x="270" y="88" width="16" height="44" rx="8" fill="#0f172a"/>
    <rect x="614" y="88" width="16" height="44" rx="8" fill="#0f172a"/>
    <circle cx="216" cy="150" r="9" fill="#ffffff" opacity="0.8"/>
    <circle cx="246" cy="150" r="9" fill="#ffffff" opacity="0.5"/>

    <!-- grid: 4 cols x 3 rows of day cells -->
    <g fill="#f1f5f9">
      <rect x="200" y="210" width="118" height="88" rx="12"/>
      <rect x="330" y="210" width="118" height="88" rx="12"/>
      <rect x="460" y="210" width="118" height="88" rx="12"/>
      <rect x="590" y="210" width="110" height="88" rx="12"/>
      <rect x="200" y="310" width="118" height="88" rx="12"/>
      <rect x="460" y="310" width="118" height="88" rx="12"/>
      <rect x="590" y="310" width="110" height="88" rx="12"/>
      <rect x="200" y="410" width="118" height="88" rx="12"/>
      <rect x="330" y="410" width="118" height="88" rx="12"/>
      <rect x="590" y="410" width="110" height="88" rx="12"/>
    </g>

    <!-- booked slot: highlighted cell with check -->
    <rect x="330" y="310" width="118" height="88" rx="12" fill="#ff5a00"/>
    <path d="M366 354 l16 16 l32 -36" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- second booked slot: capacity dots -->
    <rect x="460" y="410" width="118" height="88" rx="12" fill="#0f172a"/>
    <g>
      <circle cx="495" cy="444" r="9" fill="#ff5a00"/>
      <circle cx="519" cy="444" r="9" fill="#ff5a00"/>
      <circle cx="543" cy="444" r="9" fill="#ff5a00"/>
      <circle cx="495" cy="468" r="9" fill="#94a3b8"/>
      <circle cx="519" cy="468" r="9" fill="#94a3b8"/>
    </g>

    <!-- small event bars in normal cells -->
    <g fill="#94a3b8">
      <rect x="214" y="228" width="70" height="10" rx="5"/>
      <rect x="344" y="228" width="50" height="10" rx="5"/>
      <rect x="474" y="228" width="66" height="10" rx="5"/>
      <rect x="214" y="328" width="56" height="10" rx="5"/>
      <rect x="604" y="328" width="60" height="10" rx="5"/>
      <rect x="214" y="428" width="66" height="10" rx="5"/>
    </g>
    <g fill="#cbd5e1">
      <rect x="214" y="248" width="46" height="10" rx="5"/>
      <rect x="474" y="248" width="40" height="10" rx="5"/>
      <rect x="604" y="228" width="46" height="10" rx="5"/>
      <rect x="344" y="428" width="60" height="10" rx="5"/>
      <rect x="604" y="428" width="40" height="10" rx="5"/>
    </g>
  </g>

  <!-- clock badge -->
  <g transform="translate(795,190)">
    <circle cx="0" cy="0" r="64" fill="#0f172a"/>
    <circle cx="0" cy="0" r="48" fill="#f1f5f9"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="10" stroke="#ff5a00" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
  </g>

  <!-- iCal card flying out -->
  <g transform="translate(860,300) rotate(6)">
    <rect x="0" y="0" width="220" height="160" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="42" rx="18" fill="#0f172a"/>
    <rect x="0" y="24" width="220" height="18" fill="#0f172a"/>
    <circle cx="30" cy="21" r="6" fill="#ff5a00"/>
    <circle cx="52" cy="21" r="6" fill="#94a3b8"/>
    <rect x="24" y="64" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="24" y="90" width="170" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="24" y="112" width="140" height="10" rx="5" fill="#cbd5e1"/>
    <circle cx="182" cy="130" r="16" fill="#ff5a00"/>
    <path d="M175 130 l5 6 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M745 350 C780 350 800 342 858 330" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 10" opacity="0.6"/>

  <!-- people pair (attendees) -->
  <g transform="translate(915,540)">
    <circle cx="-28" cy="-38" r="16" fill="#0f172a"/>
    <path d="M-52 0 a24 24 0 0 1 48 0 Z" fill="#0f172a"/>
    <circle cx="24" cy="-38" r="16" fill="#ff5a00"/>
    <path d="M0 0 a24 24 0 0 1 48 0 Z" fill="#ff5a00"/>
  </g>

  <!-- accents -->
  <circle cx="1080" cy="520" r="18" fill="none" stroke="#ff5a00" stroke-width="4" opacity="0.55"/>
  <circle cx="120" cy="300" r="10" fill="#94a3b8" opacity="0.35"/>
  <circle cx="1000" cy="120" r="8" fill="#ff5a00" opacity="0.5"/>
</svg>
