<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="XML-Datenpaket zwischen Systemen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#94a3b8" opacity="0.14">
    <circle cx="100" cy="90" r="3"/><circle cx="1100" cy="80" r="3"/><circle cx="1130" cy="550" r="3"/>
    <circle cx="80" cy="540" r="3"/><circle cx="600" cy="60" r="2"/><circle cx="600" cy="580" r="2"/>
  </g>

  <!-- left system: building / Wohnungsfinder -->
  <g>
    <rect x="110" y="180" width="250" height="280" rx="20" fill="#f1f5f9"/>
    <rect x="140" y="210" width="90" height="12" rx="6" fill="#94a3b8"/>
    <!-- building -->
    <g transform="translate(150,250)">
      <rect x="0" y="60" width="70" height="120" rx="6" fill="#0f172a"/>
      <rect x="82" y="20" width="70" height="160" rx="6" fill="#0f172a"/>
      <g fill="#ff5a00">
        <rect x="14" y="78" width="14" height="14" rx="3"/>
        <rect x="42" y="78" width="14" height="14" rx="3"/>
        <rect x="14" y="108" width="14" height="14" rx="3"/>
        <rect x="96" y="38" width="14" height="14" rx="3"/>
        <rect x="124" y="38" width="14" height="14" rx="3"/>
        <rect x="96" y="68" width="14" height="14" rx="3"/>
        <rect x="124" y="98" width="14" height="14" rx="3"/>
      </g>
      <g fill="#cbd5e1">
        <rect x="42" y="108" width="14" height="14" rx="3"/>
        <rect x="14" y="138" width="14" height="14" rx="3"/>
        <rect x="124" y="68" width="14" height="14" rx="3"/>
        <rect x="96" y="98" width="14" height="14" rx="3"/>
      </g>
    </g>
  </g>

  <!-- right systems: three stacked receiver cards -->
  <g>
    <rect x="850" y="120" width="240" height="120" rx="16" fill="#f1f5f9"/>
    <circle cx="895" cy="180" r="24" fill="#0f172a"/>
    <rect x="885" y="170" width="20" height="20" rx="4" fill="#ff5a00"/>
    <rect x="935" y="160" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="935" y="186" width="80" height="10" rx="5" fill="#cbd5e1"/>

    <rect x="850" y="256" width="240" height="120" rx="16" fill="#f1f5f9"/>
    <circle cx="895" cy="316" r="24" fill="#0f172a"/>
    <path d="M885 322 L895 306 L905 322 Z" fill="#ff5a00"/>
    <rect x="935" y="296" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="935" y="322" width="80" height="10" rx="5" fill="#cbd5e1"/>

    <rect x="850" y="392" width="240" height="120" rx="16" fill="#f1f5f9"/>
    <circle cx="895" cy="452" r="24" fill="#0f172a"/>
    <circle cx="895" cy="452" r="10" fill="#ff5a00"/>
    <rect x="935" y="432" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="935" y="458" width="80" height="10" rx="5" fill="#cbd5e1"/>
  </g>

  <!-- flow lines -->
  <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 12" opacity="0.55">
    <path d="M360 320 C440 320 440 320 470 320"/>
    <path d="M730 300 C790 280 800 220 850 190"/>
    <path d="M730 320 C790 320 800 316 850 316"/>
    <path d="M730 340 C790 360 800 420 850 450"/>
  </g>
  <g fill="#ff5a00">
    <circle cx="415" cy="320" r="7"/>
    <circle cx="795" cy="255" r="6"/>
    <circle cx="795" cy="318" r="6"/>
    <circle cx="795" cy="385" r="6"/>
  </g>

  <!-- central XML package -->
  <g transform="translate(600,320)">
    <!-- box -->
    <path d="M-130 -50 L0 -110 L130 -50 V70 L0 130 L-130 70 Z" fill="url(#pkg)"/>
    <path d="M-130 -50 L0 10 L130 -50 L0 -110 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M0 10 V130" stroke="#0f172a" stroke-width="4" opacity="0.3"/>
    <!-- tape -->
    <path d="M-30 -96 L-30 -24 L0 -10 L30 -24 L30 -96 L0 -110 Z" fill="#0f172a" opacity="0.25"/>
    <!-- angle-bracket label -->
    <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-62 40 L-88 66 L-62 92"/>
      <path d="M62 40 L88 66 L62 92"/>
      <line x1="-22" y1="98" x2="22" y2="34"/>
    </g>
  </g>

  <!-- little data chips floating -->
  <g opacity="0.85">
    <rect x="480" y="170" width="56" height="26" rx="8" fill="#f1f5f9"/>
    <rect x="490" y="180" width="36" height="6" rx="3" fill="#94a3b8"/>
    <rect x="680" y="470" width="56" height="26" rx="8" fill="#f1f5f9"/>
    <rect x="690" y="480" width="36" height="6" rx="3" fill="#94a3b8"/>
    <rect x="430" y="450" width="46" height="22" rx="7" fill="#ff5a00" opacity="0.85"/>
  </g>

  <!-- accents -->
  <circle cx="185" cy="120" r="22" fill="none" stroke="#ff5a00" stroke-width="4" opacity="0.5"/>
  <circle cx="1050" cy="565" r="12" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.4"/>
</svg>
