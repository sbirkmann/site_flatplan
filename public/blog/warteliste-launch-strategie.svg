<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Countdown und wachsende Interessentenliste vor dem Launch">
  <defs>
    <linearGradient id="bgnight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a00" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgnight)"/>
  <circle cx="420" cy="300" r="330" fill="url(#ringGlow)"/>
  <g fill="#94a3b8" opacity="0.5">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="260" cy="60" r="2.5"/>
    <circle cx="1080" cy="80" r="3"/>
    <circle cx="960" cy="55" r="2"/>
    <circle cx="80" cy="540" r="2.5"/>
    <circle cx="1130" cy="520" r="2.5"/>
  </g>

  <!-- countdown ring -->
  <g transform="translate(420 300)">
    <circle r="180" fill="none" stroke="#334155" stroke-width="18"/>
    <!-- progress arc ~70% -->
    <path d="M 0 -180 A 180 180 0 1 1 -171 56" fill="none" stroke="#ff5a00" stroke-width="18" stroke-linecap="round"/>
    <circle r="140" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- tick marks -->
    <g stroke="#64748b" stroke-width="3">
      <line x1="0" y1="-124" x2="0" y2="-108"/>
      <line x1="124" y1="0" x2="108" y2="0"/>
      <line x1="0" y1="124" x2="0" y2="108"/>
      <line x1="-124" y1="0" x2="-108" y2="0"/>
      <line x1="88" y1="-88" x2="76" y2="-76"/>
      <line x1="88" y1="88" x2="76" y2="76"/>
      <line x1="-88" y1="88" x2="-76" y2="76"/>
      <line x1="-88" y1="-88" x2="-76" y2="-76"/>
    </g>
    <!-- digit blocks (abstract flip clock) -->
    <g>
      <rect x="-104" y="-38" width="60" height="76" rx="10" fill="url(#panel)"/>
      <rect x="-34" y="-38" width="60" height="76" rx="10" fill="url(#panel)"/>
      <rect x="36" y="-38" width="60" height="76" rx="10" fill="#ff5a00"/>
      <line x1="-104" y1="0" x2="-44" y2="0" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-34" y1="0" x2="26" y2="0" stroke="#94a3b8" stroke-width="2"/>
      <line x1="36" y1="0" x2="96" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <rect x="-88" y="-20" width="28" height="10" rx="5" fill="#0f172a" opacity="0.75"/>
      <rect x="-88" y="12" width="28" height="10" rx="5" fill="#0f172a" opacity="0.45"/>
      <rect x="-18" y="-20" width="28" height="10" rx="5" fill="#0f172a" opacity="0.75"/>
      <rect x="-18" y="12" width="28" height="10" rx="5" fill="#0f172a" opacity="0.45"/>
      <rect x="52" y="-20" width="28" height="10" rx="5" fill="#ffffff" opacity="0.95"/>
      <rect x="52" y="12" width="28" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    </g>
    <!-- progress endpoint dot -->
    <circle cx="-171" cy="56" r="13" fill="#ffffff" stroke="#ff5a00" stroke-width="5"/>
  </g>

  <!-- rocket / launch hint above ring -->
  <g transform="translate(420 78)">
    <path d="M 0 -26 C 10 -12 12 6 6 22 L -6 22 C -12 6 -10 -12 0 -26 Z" fill="#f1f5f9"/>
    <circle cx="0" cy="-2" r="4.5" fill="#0f172a"/>
    <path d="M -6 22 L -14 34 L -4 30 Z" fill="#94a3b8"/>
    <path d="M 6 22 L 14 34 L 4 30 Z" fill="#94a3b8"/>
    <path d="M 0 30 L 0 46" stroke="#ff5a00" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- growing waiting list panel -->
  <g>
    <rect x="740" y="120" width="330" height="390" rx="18" fill="url(#panel)"/>
    <rect x="740" y="120" width="330" height="58" rx="18" fill="#0f172a"/>
    <rect x="740" y="150" width="330" height="28" fill="#0f172a"/>
    <circle cx="772" cy="149" r="10" fill="#ff5a00"/>
    <rect x="794" y="143" width="150" height="12" rx="6" fill="#f1f5f9"/>

    <!-- list rows: people joining -->
    <g>
      <circle cx="782" cy="216" r="16" fill="#94a3b8"/>
      <circle cx="782" cy="210" r="6" fill="#f1f5f9"/>
      <path d="M 771 224 A 11 8 0 0 1 793 224 Z" fill="#f1f5f9"/>
      <rect x="812" y="204" width="160" height="10" rx="5" fill="#64748b"/>
      <rect x="812" y="222" width="100" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="1032" cy="216" r="11" fill="#ff5a00"/>
      <path d="M 1026 216 L 1030 221 L 1039 210" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="782" cy="278" r="16" fill="#94a3b8"/>
      <circle cx="782" cy="272" r="6" fill="#f1f5f9"/>
      <path d="M 771 286 A 11 8 0 0 1 793 286 Z" fill="#f1f5f9"/>
      <rect x="812" y="266" width="140" height="10" rx="5" fill="#64748b"/>
      <rect x="812" y="284" width="120" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="1032" cy="278" r="11" fill="#ff5a00"/>
      <path d="M 1026 278 L 1030 283 L 1039 272" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="782" cy="340" r="16" fill="#94a3b8"/>
      <circle cx="782" cy="334" r="6" fill="#f1f5f9"/>
      <path d="M 771 348 A 11 8 0 0 1 793 348 Z" fill="#f1f5f9"/>
      <rect x="812" y="328" width="170" height="10" rx="5" fill="#64748b"/>
      <rect x="812" y="346" width="90" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="1032" cy="340" r="11" fill="#ff5a00"/>
      <path d="M 1026 340 L 1030 345 L 1039 334" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g opacity="0.65">
      <circle cx="782" cy="402" r="16" fill="#cbd5e1"/>
      <circle cx="782" cy="396" r="6" fill="#ffffff"/>
      <path d="M 771 410 A 11 8 0 0 1 793 410 Z" fill="#ffffff"/>
      <rect x="812" y="390" width="130" height="10" rx="5" fill="#94a3b8"/>
      <rect x="812" y="408" width="110" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="1032" cy="402" r="11" fill="#cbd5e1"/>
    </g>
    <!-- growth bar at panel bottom -->
    <rect x="772" y="452" width="266" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="772" y="452" width="186" height="14" rx="7" fill="#ff5a00"/>
    <circle cx="958" cy="459" r="10" fill="#ffffff" stroke="#ff5a00" stroke-width="4"/>
  </g>

  <!-- connector from countdown to list -->
  <path d="M 612 300 C 670 300 690 260 738 236" fill="none" stroke="#ff5a00" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="738" cy="236" r="5" fill="#ff5a00"/>

  <!-- ground line -->
  <line x1="90" y1="560" x2="1110" y2="560" stroke="#334155" stroke-width="2"/>
  <g fill="#ff5a00">
    <circle cx="420" cy="560" r="6"/>
    <circle cx="905" cy="560" r="6"/>
  </g>
</svg>
