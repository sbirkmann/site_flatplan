<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Datenfluss vom Wohnungsfinder ins CRM-System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1b2947"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#94a3b8" opacity="0.14">
    <circle cx="90" cy="80" r="3"/><circle cx="1110" cy="90" r="3"/><circle cx="1130" cy="550" r="3"/>
    <circle cx="70" cy="540" r="3"/><circle cx="600" cy="55" r="2"/><circle cx="600" cy="585" r="2"/>
  </g>

  <!-- left: Wohnungsfinder browser window -->
  <g>
    <rect x="100" y="140" width="360" height="350" rx="20" fill="#f1f5f9"/>
    <path d="M100 160 a20 20 0 0 1 20 -20 h320 a20 20 0 0 1 20 20 v28 h-360 Z" fill="#0f172a"/>
    <circle cx="128" cy="164" r="6" fill="#ff5a00"/>
    <circle cx="150" cy="164" r="6" fill="#94a3b8"/>
    <circle cx="172" cy="164" r="6" fill="#cbd5e1"/>
    <!-- building with clickable units -->
    <g transform="translate(135,215)">
      <rect x="0" y="40" width="90" height="200" rx="8" fill="#0f172a"/>
      <rect x="102" y="0" width="90" height="240" rx="8" fill="#1e293b"/>
      <g fill="#cbd5e1">
        <rect x="14" y="60" width="26" height="20" rx="4"/>
        <rect x="50" y="60" width="26" height="20" rx="4"/>
        <rect x="14" y="96" width="26" height="20" rx="4"/>
        <rect x="116" y="24" width="26" height="20" rx="4"/>
        <rect x="152" y="24" width="26" height="20" rx="4"/>
        <rect x="116" y="60" width="26" height="20" rx="4"/>
        <rect x="152" y="96" width="26" height="20" rx="4"/>
        <rect x="14" y="132" width="26" height="20" rx="4"/>
        <rect x="152" y="132" width="26" height="20" rx="4"/>
      </g>
      <!-- highlighted unit + cursor -->
      <rect x="112" y="92" width="34" height="28" rx="5" fill="#ff5a00"/>
      <path d="M160 130 l0 26 l7 -7 l6 12 l8 -4 l-6 -12 l10 -1 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    </g>
    <!-- form strip -->
    <g transform="translate(350,230)">
      <rect x="0" y="0" width="88" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="12" y="14" width="64" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="12" y="34" width="64" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="12" y="54" width="46" height="9" rx="4.5" fill="#cbd5e1"/>
      <rect x="12" y="84" width="64" height="22" rx="11" fill="#ff5a00"/>
    </g>
  </g>

  <!-- middle: data flow pipeline -->
  <g fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.6">
    <path d="M460 280 C540 280 560 280 620 280" stroke-dasharray="10 12"/>
    <path d="M460 350 C540 350 560 350 620 350" stroke-dasharray="10 12"/>
  </g>
  <!-- data packets -->
  <g>
    <rect x="500" y="262" width="52" height="34" rx="9" fill="url(#accent)"/>
    <rect x="510" y="272" width="32" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="510" y="282" width="22" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>
    <rect x="560" y="334" width="44" height="30" rx="8" fill="#f1f5f9"/>
    <rect x="569" y="343" width="26" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="569" y="352" width="18" height="5" rx="2.5" fill="#cbd5e1"/>
    <circle cx="590" cy="280" r="6" fill="#ff5a00"/>
    <circle cx="520" cy="350" r="6" fill="#ff5a00"/>
  </g>

  <!-- gear between flows (automation) -->
  <g transform="translate(553,447)">
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#94a3b8" stroke-width="3" opacity="0.9"/>
    <g fill="#94a3b8">
      <rect x="-5" y="-46" width="10" height="14" rx="3"/>
      <rect x="-5" y="32" width="10" height="14" rx="3"/>
      <rect x="-46" y="-5" width="14" height="10" rx="3"/>
      <rect x="32" y="-5" width="14" height="10" rx="3"/>
      <rect x="-38" y="-38" width="12" height="12" rx="3" transform="rotate(45 -32 -32)"/>
      <rect x="26" y="26" width="12" height="12" rx="3" transform="rotate(45 32 32)"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff5a00" stroke-width="6"/>
  </g>

  <!-- right: CRM board -->
  <g>
    <rect x="620" y="120" width="480" height="390" rx="22" fill="#f1f5f9"/>
    <rect x="652" y="150" width="130" height="14" rx="7" fill="#94a3b8"/>
    <circle cx="1064" cy="157" r="12" fill="#ff5a00"/>
    <!-- three kanban columns -->
    <g>
      <rect x="650" y="190" width="132" height="290" rx="14" fill="#e2e8f0"/>
      <rect x="666" y="206" width="70" height="10" rx="5" fill="#94a3b8"/>
      <rect x="662" y="230" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="682" cy="252" r="10" fill="#ff5a00"/>
      <rect x="700" y="246" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="700" y="262" width="42" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="662" y="302" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="682" cy="324" r="10" fill="#0f172a"/>
      <rect x="700" y="318" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="700" y="334" width="42" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="662" y="374" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="682" cy="396" r="10" fill="#94a3b8"/>
      <rect x="700" y="390" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="700" y="406" width="42" height="8" rx="4" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="794" y="190" width="132" height="290" rx="14" fill="#e2e8f0"/>
      <rect x="810" y="206" width="70" height="10" rx="5" fill="#94a3b8"/>
      <rect x="806" y="230" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="826" cy="252" r="10" fill="#ff5a00"/>
      <rect x="844" y="246" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="844" y="262" width="42" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="806" y="302" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="826" cy="324" r="10" fill="#0f172a"/>
      <rect x="844" y="318" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="844" y="334" width="42" height="8" rx="4" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="938" y="190" width="132" height="290" rx="14" fill="#e2e8f0"/>
      <rect x="954" y="206" width="70" height="10" rx="5" fill="#94a3b8"/>
      <rect x="950" y="230" width="108" height="62" rx="10" fill="#ffffff"/>
      <circle cx="970" cy="252" r="10" fill="#ff5a00"/>
      <path d="M965 252 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="988" y="246" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="988" y="262" width="42" height="8" rx="4" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- new card sliding in from pipeline -->
  <g transform="translate(596,268) rotate(-6)">
    <rect x="0" y="0" width="96" height="56" rx="10" fill="#ffffff" stroke="#ff5a00" stroke-width="3"/>
    <circle cx="20" cy="20" r="9" fill="#ff5a00"/>
    <rect x="36" y="14" width="46" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="36" y="30" width="34" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- accents -->
  <circle cx="180" cy="100" r="20" fill="none" stroke="#ff5a00" stroke-width="4" opacity="0.5"/>
  <circle cx="1060" cy="560" r="12" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.4"/>
  <circle cx="520" cy="120" r="8" fill="#ff5a00" opacity="0.55"/>
</svg>
