<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Preisschild mit Kurve und Benachrichtigungsglocke">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a00" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="90" cy="90" r="3"/><circle cx="1110" cy="70" r="3"/><circle cx="1140" cy="560" r="3"/>
    <circle cx="70" cy="540" r="3"/><circle cx="1050" cy="140" r="2"/><circle cx="150" cy="150" r="2"/>
  </g>

  <!-- chart panel -->
  <g>
    <rect x="130" y="120" width="700" height="400" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="170" y="155" width="130" height="14" rx="7" fill="#94a3b8"/>
    <rect x="170" y="180" width="80" height="10" rx="5" fill="#cbd5e1"/>
    <!-- gridlines -->
    <line x1="170" y1="250" x2="790" y2="250" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="170" y1="320" x2="790" y2="320" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="170" y1="390" x2="790" y2="390" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="170" y1="460" x2="790" y2="460" stroke="#e2e8f0" stroke-width="3"/>
    <!-- price staircase area -->
    <path d="M170 430 H330 V370 H520 V300 H700 V240 H790 V460 H170 Z" fill="url(#area)"/>
    <!-- staircase line -->
    <path d="M170 430 H330 V370 H520 V300 H700 V240 H790" fill="none" stroke="#ff5a00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="430" r="9" fill="#0f172a"/>
    <circle cx="520" cy="370" r="9" fill="#0f172a"/>
    <circle cx="700" cy="300" r="9" fill="#0f172a"/>
    <circle cx="790" cy="240" r="11" fill="#ff5a00" stroke="#ffffff" stroke-width="4"/>
    <!-- milestone flags -->
    <line x1="330" y1="430" x2="330" y2="460" stroke="#94a3b8" stroke-width="3"/>
    <line x1="520" y1="370" x2="520" y2="460" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="700" y1="300" x2="700" y2="460" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
  </g>

  <!-- price tag -->
  <g transform="translate(870,150) rotate(12)">
    <path d="M0 60 L95 0 H235 A25 25 0 0 1 260 25 V155 A25 25 0 0 1 235 180 H95 Z" fill="url(#tag)"/>
    <circle cx="72" cy="90" r="18" fill="#ffffff"/>
    <circle cx="72" cy="90" r="8" fill="#0f172a"/>
    <!-- € glyph as graphic label -->
    <text x="165" y="112" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">€</text>
    <!-- string -->
    <path d="M60 78 C20 40 -10 30 -40 44" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- notification bell -->
  <g transform="translate(985,420)">
    <circle cx="0" cy="0" r="78" fill="#0f172a"/>
    <path d="M0 -44 C-26 -44 -38 -24 -38 -2 C-38 18 -46 26 -52 32 H52 C46 26 38 18 38 -2 C38 -24 26 -44 0 -44 Z" fill="#f1f5f9"/>
    <path d="M-12 40 A12 12 0 0 0 12 40 Z" fill="#f1f5f9"/>
    <circle cx="40" cy="-40" r="20" fill="#ff5a00" stroke="#0f172a" stroke-width="5"/>
    <!-- ring waves -->
    <path d="M-58 -34 A66 66 0 0 1 -44 -52" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 6 A66 66 0 0 0 62 -14" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- small building silhouette bottom-left -->
  <g transform="translate(150,545)" fill="#0f172a">
    <rect x="0" y="-70" width="52" height="70" rx="4"/>
    <rect x="62" y="-100" width="52" height="100" rx="4"/>
    <rect x="124" y="-52" width="52" height="52" rx="4"/>
    <g fill="#ff5a00">
      <rect x="12" y="-56" width="10" height="10" rx="2"/>
      <rect x="30" y="-56" width="10" height="10" rx="2"/>
      <rect x="74" y="-86" width="10" height="10" rx="2"/>
      <rect x="92" y="-86" width="10" height="10" rx="2"/>
      <rect x="74" y="-62" width="10" height="10" rx="2"/>
      <rect x="136" y="-38" width="10" height="10" rx="2"/>
    </g>
  </g>

  <!-- accents -->
  <circle cx="1120" cy="250" r="16" fill="none" stroke="#ff5a00" stroke-width="4" opacity="0.6"/>
  <circle cx="80" cy="330" r="10" fill="#94a3b8" opacity="0.35"/>
</svg>
