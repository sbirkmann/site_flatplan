<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="QR-Code auf Bauzaun vor Neubauprojekt">
  <defs>
    <linearGradient id="daysky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fence" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="630" fill="url(#daysky)"/>
  <circle cx="150" cy="110" r="46" fill="#ff5a00" opacity="0.9"/>

  <!-- building under construction behind fence -->
  <g>
    <rect x="640" y="120" width="220" height="260" fill="#94a3b8"/>
    <g fill="#f1f5f9">
      <rect x="664" y="146" width="34" height="26" rx="3"/>
      <rect x="716" y="146" width="34" height="26" rx="3"/>
      <rect x="768" y="146" width="34" height="26" rx="3"/>
      <rect x="664" y="192" width="34" height="26" rx="3"/>
      <rect x="768" y="192" width="34" height="26" rx="3"/>
      <rect x="664" y="238" width="34" height="26" rx="3"/>
      <rect x="716" y="238" width="34" height="26" rx="3"/>
      <rect x="768" y="238" width="34" height="26" rx="3"/>
    </g>
    <rect x="716" y="192" width="34" height="26" rx="3" fill="#ff5a00"/>
    <!-- unfinished top floor -->
    <g stroke="#64748b" stroke-width="5" fill="none">
      <line x1="640" y1="120" x2="640" y2="86"/>
      <line x1="713" y1="120" x2="713" y2="86"/>
      <line x1="786" y1="120" x2="786" y2="86"/>
      <line x1="860" y1="120" x2="860" y2="86"/>
      <line x1="628" y1="86" x2="872" y2="86"/>
    </g>
  </g>

  <!-- crane -->
  <g stroke="#0f172a" stroke-width="7" fill="none">
    <line x1="960" y1="380" x2="960" y2="80"/>
    <line x1="850" y1="102" x2="1130" y2="102"/>
    <line x1="960" y1="80" x2="850" y2="102"/>
    <line x1="960" y1="80" x2="1075" y2="102"/>
  </g>
  <line x1="1075" y1="102" x2="1075" y2="170" stroke="#0f172a" stroke-width="4"/>
  <path d="M 1062 170 L 1088 170 L 1082 196 L 1068 196 Z" fill="#ff5a00"/>
  <rect x="940" y="102" width="40" height="26" fill="#0f172a"/>

  <!-- second building silhouette -->
  <rect x="420" y="200" width="170" height="180" fill="#64748b" opacity="0.6"/>
  <g fill="#e2e8f0" opacity="0.8">
    <rect x="440" y="222" width="26" height="20" rx="3"/>
    <rect x="484" y="222" width="26" height="20" rx="3"/>
    <rect x="528" y="222" width="26" height="20" rx="3"/>
    <rect x="440" y="260" width="26" height="20" rx="3"/>
    <rect x="528" y="260" width="26" height="20" rx="3"/>
  </g>

  <!-- ground -->
  <rect x="0" y="560" width="1200" height="70" fill="#0f172a"/>

  <!-- construction fence: planks -->
  <g>
    <rect x="0" y="380" width="1200" height="180" fill="url(#fence)"/>
    <g stroke="#334155" stroke-width="3">
      <line x1="150" y1="380" x2="150" y2="560"/>
      <line x1="300" y1="380" x2="300" y2="560"/>
      <line x1="450" y1="380" x2="450" y2="560"/>
      <line x1="750" y1="380" x2="750" y2="560"/>
      <line x1="900" y1="380" x2="900" y2="560"/>
      <line x1="1050" y1="380" x2="1050" y2="560"/>
    </g>
    <rect x="0" y="380" width="1200" height="10" fill="#334155"/>
    <!-- fence decoration: outline building motif + stripes -->
    <g stroke="#475569" stroke-width="3" fill="none" opacity="0.9">
      <path d="M 190 520 L 190 452 L 232 430 L 274 452 L 274 520"/>
      <rect x="206" y="472" width="18" height="16"/>
      <rect x="238" y="472" width="18" height="16"/>
      <rect x="222" y="494" width="20" height="26"/>
    </g>
    <g fill="#ff5a00" opacity="0.85">
      <rect x="960" y="470" width="14" height="52" transform="rotate(45 967 496)"/>
      <rect x="1000" y="470" width="14" height="52" transform="rotate(45 1007 496)"/>
      <rect x="1040" y="470" width="14" height="52" transform="rotate(45 1047 496)"/>
    </g>
    <circle cx="375" cy="470" r="22" fill="none" stroke="#475569" stroke-width="3"/>
    <circle cx="375" cy="470" r="8" fill="#475569"/>
  </g>

  <!-- QR poster on the fence -->
  <g transform="translate(0 -28)">
    <rect x="480" y="398" width="240" height="240" rx="14" fill="#ffffff"/>
    <rect x="480" y="398" width="240" height="240" rx="14" fill="none" stroke="#ff5a00" stroke-width="6"/>
    <!-- QR: finder patterns -->
    <g fill="#0f172a">
      <rect x="508" y="426" width="56" height="56" rx="6"/>
      <rect x="636" y="426" width="56" height="56" rx="6"/>
      <rect x="508" y="554" width="56" height="56" rx="6"/>
    </g>
    <g fill="#ffffff">
      <rect x="520" y="438" width="32" height="32" rx="4"/>
      <rect x="648" y="438" width="32" height="32" rx="4"/>
      <rect x="520" y="566" width="32" height="32" rx="4"/>
    </g>
    <g fill="#0f172a">
      <rect x="528" y="446" width="16" height="16" rx="2"/>
      <rect x="656" y="446" width="16" height="16" rx="2"/>
      <rect x="528" y="574" width="16" height="16" rx="2"/>
    </g>
    <!-- QR: data modules -->
    <g fill="#0f172a">
      <rect x="580" y="426" width="14" height="14"/>
      <rect x="604" y="440" width="14" height="14"/>
      <rect x="580" y="468" width="14" height="14"/>
      <rect x="612" y="468" width="14" height="14"/>
      <rect x="508" y="498" width="14" height="14"/>
      <rect x="536" y="498" width="14" height="14"/>
      <rect x="566" y="512" width="14" height="14"/>
      <rect x="594" y="498" width="14" height="14"/>
      <rect x="622" y="512" width="14" height="14"/>
      <rect x="650" y="498" width="14" height="14"/>
      <rect x="678" y="512" width="14" height="14"/>
      <rect x="522" y="526" width="14" height="14"/>
      <rect x="594" y="526" width="14" height="14"/>
      <rect x="650" y="540" width="14" height="14"/>
      <rect x="594" y="554" width="14" height="14"/>
      <rect x="622" y="568" width="14" height="14"/>
      <rect x="678" y="554" width="14" height="14"/>
      <rect x="594" y="582" width="14" height="14"/>
      <rect x="650" y="582" width="14" height="14"/>
      <rect x="678" y="596" width="14" height="14"/>
    </g>
    <rect x="608" y="512" width="14" height="14" fill="#ff5a00"/>
  </g>

  <!-- hand with phone scanning -->
  <g>
    <rect x="238" y="180" width="130" height="236" rx="20" fill="#0f172a"/>
    <rect x="250" y="204" width="106" height="180" rx="8" fill="#f1f5f9"/>
    <rect x="284" y="190" width="38" height="6" rx="3" fill="#475569"/>
    <!-- mini finder on phone screen -->
    <rect x="262" y="216" width="82" height="52" rx="6" fill="#94a3b8"/>
    <path d="M 262 268 L 290 244 L 312 260 L 344 232 L 344 268 Z" fill="#64748b"/>
    <circle cx="330" cy="228" r="7" fill="#ff5a00"/>
    <rect x="262" y="280" width="58" height="9" rx="4.5" fill="#64748b"/>
    <rect x="262" y="298" width="82" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="262" y="316" width="70" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="262" y="340" width="52" height="20" rx="10" fill="#ff5a00"/>
    <!-- scan beam from phone to QR poster -->
    <path d="M 368 300 L 480 430 L 480 606 L 368 380 Z" fill="#ff5a00" opacity="0.14"/>
    <g stroke="#ff5a00" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round">
      <line x1="368" y1="308" x2="478" y2="440"/>
      <line x1="368" y1="372" x2="478" y2="596"/>
    </g>
  </g>

  <!-- scan corners around QR poster -->
  <g stroke="#ff5a00" stroke-width="7" fill="none" stroke-linecap="round" transform="translate(0 -28)">
    <path d="M 462 424 L 462 384 L 502 384"/>
    <path d="M 698 384 L 738 384 L 738 424"/>
    <path d="M 738 598 L 738 638 L 698 638"/>
    <path d="M 502 638 L 462 638 L 462 598"/>
  </g>

  <!-- birds -->
  <g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 320 90 Q 330 80 340 90 Q 350 80 360 90"/>
    <path d="M 400 120 Q 408 113 416 120 Q 424 113 432 120"/>
  </g>
</svg>
