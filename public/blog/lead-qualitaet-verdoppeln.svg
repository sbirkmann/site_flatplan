<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Trichter, der Besucher zu qualifizierten Leads filtert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <linearGradient id="fun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="90" cy="80" r="3"/><circle cx="1110" cy="70" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="70" cy="550" r="3"/><circle cx="300" cy="60" r="2"/><circle cx="900" cy="580" r="2"/>
  </g>

  <!-- crowd of visitor dots (top) -->
  <g>
    <circle cx="420" cy="90" r="14" fill="#cbd5e1"/>
    <circle cx="472" cy="72" r="14" fill="#94a3b8"/>
    <circle cx="524" cy="96" r="14" fill="#cbd5e1"/>
    <circle cx="576" cy="68" r="14" fill="#94a3b8"/>
    <circle cx="628" cy="94" r="14" fill="#cbd5e1"/>
    <circle cx="680" cy="74" r="14" fill="#94a3b8"/>
    <circle cx="732" cy="92" r="14" fill="#cbd5e1"/>
    <circle cx="498" cy="126" r="14" fill="#ff5a00"/>
    <circle cx="550" cy="132" r="14" fill="#cbd5e1"/>
    <circle cx="602" cy="124" r="14" fill="#ff5a00"/>
    <circle cx="654" cy="130" r="14" fill="#94a3b8"/>
    <circle cx="706" cy="126" r="14" fill="#ff5a00"/>
  </g>

  <!-- funnel with three filter stages -->
  <g>
    <path d="M380 175 H820 L730 320 H470 Z" fill="url(#fun)"/>
    <path d="M470 320 H730 L672 440 H528 Z" fill="#1e293b"/>
    <path d="M528 440 H672 L636 530 H564 Z" fill="#ff5a00"/>
    <!-- stage separators -->
    <line x1="470" y1="320" x2="730" y2="320" stroke="#f8fafc" stroke-width="5"/>
    <line x1="528" y1="440" x2="672" y2="440" stroke="#f8fafc" stroke-width="5"/>
    <!-- stage icons: gate (mail), fields (form), double-opt-in (check) -->
    <g transform="translate(600,247)">
      <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#f1f5f9"/>
      <path d="M-26 -12 l26 18 l26 -18" fill="none" stroke="#0f172a" stroke-width="4"/>
    </g>
    <g transform="translate(600,380)">
      <rect x="-30" y="-16" width="60" height="10" rx="5" fill="#94a3b8"/>
      <rect x="-30" y="2" width="42" height="10" rx="5" fill="#94a3b8"/>
      <circle cx="24" cy="7" r="8" fill="#ff5a00"/>
    </g>
    <g transform="translate(600,485)" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-18 0 l12 13 l24 -27"/>
    </g>
  </g>

  <!-- filtered-out dots bouncing off sides -->
  <g opacity="0.6">
    <circle cx="368" cy="270" r="10" fill="#cbd5e1"/>
    <circle cx="340" cy="330" r="8" fill="#cbd5e1"/>
    <circle cx="840" cy="280" r="10" fill="#cbd5e1"/>
    <circle cx="866" cy="345" r="8" fill="#cbd5e1"/>
    <path d="M430 300 C400 320 385 350 380 385" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="5 8"/>
    <path d="M770 300 C800 320 815 350 820 385" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="5 8"/>
  </g>

  <!-- qualified leads output -->
  <g>
    <path d="M600 530 V560" stroke="#ff5a00" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g transform="translate(600,585)">
      <circle cx="-56" cy="0" r="17" fill="#ff5a00"/>
      <circle cx="0" cy="0" r="17" fill="#ff5a00"/>
      <circle cx="56" cy="0" r="17" fill="#ff5a00"/>
      <path d="M-63 0 l5 6 l10 -11 M-7 0 l5 6 l10 -11 M49 0 l5 6 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- left panel: A/B/C rating card -->
  <g>
    <rect x="105" y="200" width="200" height="230" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="130" y="226" width="90" height="12" rx="6" fill="#94a3b8"/>
    <circle cx="148" cy="282" r="14" fill="#ff5a00"/>
    <rect x="174" y="274" width="100" height="14" rx="7" fill="#ff5a00"/>
    <circle cx="148" cy="332" r="14" fill="#0f172a"/>
    <rect x="174" y="324" width="72" height="14" rx="7" fill="#0f172a"/>
    <circle cx="148" cy="382" r="14" fill="#94a3b8"/>
    <rect x="174" y="374" width="46" height="14" rx="7" fill="#94a3b8"/>
  </g>
  <path d="M305 320 C340 320 350 320 375 300" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 10" opacity="0.5"/>

  <!-- right panel: rising quality chart -->
  <g>
    <rect x="895" y="200" width="200" height="230" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="920" y="226" width="90" height="12" rx="6" fill="#94a3b8"/>
    <line x1="920" y1="390" x2="1070" y2="390" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="925" y="350" width="26" height="40" rx="6" fill="#cbd5e1"/>
    <rect x="962" y="325" width="26" height="65" rx="6" fill="#94a3b8"/>
    <rect x="999" y="295" width="26" height="95" rx="6" fill="#ffb38a"/>
    <rect x="1036" y="260" width="26" height="130" rx="6" fill="#ff5a00"/>
    <path d="M938 335 L975 310 L1012 280 L1049 245" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1049" cy="245" r="7" fill="#0f172a"/>
  </g>
  <path d="M825 300 C860 320 870 320 895 320" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 10" opacity="0.5"/>

  <!-- accents -->
  <circle cx="180" cy="120" r="20" fill="none" stroke="#ff5a00" stroke-width="4" opacity="0.5"/>
  <circle cx="1020" cy="530" r="14" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.4"/>
  <circle cx="990" cy="120" r="8" fill="#ff5a00" opacity="0.5"/>
</svg>
