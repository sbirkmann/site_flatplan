[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "curl -fsSL https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz",
  "sudo mkdir -p /opt/node && sudo tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1",
  "sudo /opt/node/bin/npm install -g pnpm@11.11.0",
  "PATH=/opt/node/bin:$PATH /opt/node/bin/pnpm i --frozen-lockfile"
]

[phases.build]
cmds = ["PATH=/opt/node/bin:$PATH /opt/node/bin/pnpm run build"]

[start]
cmd = "PATH=/opt/node/bin:$PATH /opt/node/bin/pnpm run start"
